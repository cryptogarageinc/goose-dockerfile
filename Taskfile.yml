version: "3"
tasks:
  lint:
    deps:
      - task: gha-lint
      - task: hadolint
  gha-lint:
    vars:
      PINACT_VERSION: v5.0.2
      ACTIONLINT_VERSION: v1.7.12
      GHALINT_VERSION: v1.6.0
    cmds:
      - go run github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@{{.PINACT_VERSION}} run
      - go run github.com/rhysd/actionlint/cmd/actionlint@{{.ACTIONLINT_VERSION}}
      - go run github.com/suzuki-shunsuke/ghalint/cmd/ghalint@{{.GHALINT_VERSION}} run
  hadolint:
    cmds:
      - docker run --rm -i -v {{.TASK_DIR}}/.hadolint.yml:/.config/hadolint.yaml ghcr.io/hadolint/hadolint < Dockerfile
      - docker run --rm -i -v {{.TASK_DIR}}/.hadolint.yml:/.config/hadolint.yaml ghcr.io/hadolint/hadolint < platform.dockerfile
  format:
    vars:
      YAMLFMT_VERSION: v0.21.0
    cmds:
      - go run github.com/google/yamlfmt/cmd/yamlfmt@{{.YAMLFMT_VERSION}}
  build-platform-push:
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64 -f platform.dockerfile --push .
  build-platform-check:
    cmds:
      - docker buildx build --platform linux/amd64,linux/arm64 -f platform.dockerfile --load .
